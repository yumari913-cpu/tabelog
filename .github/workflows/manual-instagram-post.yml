name: Manual Instagram Post

on:
  workflow_dispatch:
    inputs:
      review_url:
        description: "食べログ口コミ詳細URL"
        required: true
        type: string
      dry_run:
        description: "trueなら投稿せず内容確認だけ"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      caption_style:
        description: "キャプション文体"
        required: true
        default: "story"
        type: choice
        options:
          - "story"
          - "short"
          - "review"

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build post assets
        id: build
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_post_assets.py \
            --review-url "${{ inputs.review_url }}" \
            --caption-style "${{ inputs.caption_style }}" | tee build_output.txt
          REVIEW_ID="$(grep '^review_id=' build_output.txt | cut -d= -f2)"
          MANIFEST="$(grep '^manifest=' build_output.txt | cut -d= -f2)"
          echo "review_id=${REVIEW_ID}" >> "$GITHUB_OUTPUT"
          echo "manifest=${MANIFEST}" >> "$GITHUB_OUTPUT"

      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d generated ]; then
            git add generated/
          fi
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Add Instagram assets for ${{ steps.build.outputs.review_id }}"
            git push
          fi

      - name: Publish or preview
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          RAW_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/$(git rev-parse HEAD)"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/publish_generated_post.py \
              --manifest "${{ steps.build.outputs.manifest }}" \
              --raw-base-url "${RAW_BASE}" \
              --dry-run
          else
            python scripts/publish_generated_post.py \
              --manifest "${{ steps.build.outputs.manifest }}" \
              --raw-base-url "${RAW_BASE}"
          fi
