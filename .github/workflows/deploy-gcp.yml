name: Deploy to GCP Cloud Run

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and deploy
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          SERVICE: tabelog-instagram
          BUCKET: ${{ vars.GCS_BUCKET }}
          REVIEWER_URL: https://tabelog.com/rvwr/018712231/
          AUTO_PUBLISH_FEED: ${{ vars.AUTO_PUBLISH_FEED }}
          AUTO_PUBLISH_STORY: ${{ vars.AUTO_PUBLISH_STORY }}
          AUTO_PUBLISH_REEL: ${{ vars.AUTO_PUBLISH_REEL }}
          INSTAGRAM_POST_STORY: ${{ vars.INSTAGRAM_POST_STORY }}
          THREADS_AUTO_PUBLISH: ${{ vars.THREADS_AUTO_PUBLISH }}
          THREADS_AUTO_REPLY: ${{ vars.THREADS_AUTO_REPLY }}
          THREADS_POSTS_PER_DAY: ${{ vars.THREADS_POSTS_PER_DAY }}
          THREADS_INSTAGRAM_PROFILE_URL: https://www.instagram.com/mogmogtro112233/
          SYNC_TOKEN_VALUE: ${{ secrets.SYNC_TOKEN_VALUE }}
        run: bash deploy/gcp_setup.sh
