name: Post Story Once B527303939

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/post-story-once-b527303939.yml"

jobs:
  story:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build story asset
        id: build
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_post_assets.py \
            --review-url "https://tabelog.com/rvwr/018712231/rvwdtl/B527303939/" \
            --caption-style "story" | tee build_output.txt
          REVIEW_ID="$(grep '^review_id=' build_output.txt | cut -d= -f2)"
          MANIFEST="$(grep '^manifest=' build_output.txt | cut -d= -f2-)"
          echo "review_id=${REVIEW_ID}" >> "$GITHUB_OUTPUT"
          {
            echo "manifest<<EOF"
            echo "${MANIFEST}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit generated story asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Add Instagram story asset for B527303939"
            git push
          fi

      - name: Publish story
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          RAW_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/$(git rev-parse HEAD)"
          python scripts/publish_generated_post.py \
            --manifest "${{ steps.build.outputs.manifest }}" \
            --raw-base-url "${RAW_BASE}" \
            --story-only
